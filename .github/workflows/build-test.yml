name: Build Lint Test

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'src_go/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/build-test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Build shared test-server binaries once
        working-directory: src_go
        run: |
          GOOS=linux GOARCH=amd64 go build -o ../src/bsm_test_utils/data/bedrock_server main.go
          GOOS=windows GOARCH=amd64 go build -o ../src/bsm_test_utils/data/bedrock_server.exe main.go
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: pre-commit run --all-files
      - uses: actions/upload-artifact@v4
        with:
          name: test-server-binaries
          path: |
            src/bsm_test_utils/data/bedrock_server
            src/bsm_test_utils/data/bedrock_server.exe
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: test-server-binaries
          path: src/bsm_test_utils/data
      - run: chmod +x src/bsm_test_utils/data/bedrock_server
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
