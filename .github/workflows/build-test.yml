name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'src_go/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.pre-commit-config.yaml'
      - '.github/actions/**'
      - '.github/workflows/build-test.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-go-binaries
      - name: Run Go unit tests
        working-directory: src_go
        run: go test -v ./...
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install build -e '.[dev]'
      - name: Build package
        if: matrix.python-version == '3.14'
        run: python -m build
      - name: Run tests
        run: python -m pytest
      - name: Validate installed distribution wheel
        if: matrix.python-version == '3.14'
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl pytest
          /tmp/wheel-venv/bin/pytest tests -o addopts=""
