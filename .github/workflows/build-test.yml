name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'src_go/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.pre-commit-config.yaml'
      - '.github/actions/**'
      - '.github/workflows/build-test.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-go-binaries
      - name: Run Go unit tests
        working-directory: src_go
        run: go test -v ./...
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install build -e '.[dev]'
      - name: Build package
        if: matrix.python-version == '3.14'
        run: python -m build
      - name: Run tests
        run: python -m pytest
      - name: Upload wheel for installation checks
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: test-utils-wheel
          path: dist/*.whl
          if-no-files-found: error

  installed-wheel:
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: test-utils-wheel
          path: ${{ runner.temp }}/wheel
      - name: Install and exercise the wheel outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install wheel/*.whl pytest
          python -c "from pathlib import Path; import sysconfig, bsm_test_utils; assert Path(bsm_test_utils.__file__).resolve().is_relative_to(Path(sysconfig.get_path('purelib')).resolve())"
          cp "$GITHUB_WORKSPACE/tests/test_setup.py" .
          cp "$GITHUB_WORKSPACE/tests/test_dummy_server_exec.py" .
          python -I -m pytest -q test_setup.py test_dummy_server_exec.py
