name: Build Lint Test

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'src_go/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/build-test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install build -e '.[dev]'
      - name: Build test server
        working-directory: src_go
        run: |
          GOOS=linux GOARCH=amd64 go build -o ../src/bsm_test_utils/data/bedrock_server main.go
          GOOS=windows GOARCH=amd64 go build -o ../src/bsm_test_utils/data/bedrock_server.exe main.go
      - name: Build package
        if: matrix.python-version == '3.14'
        run: python -m build
      - name: Lint and type checks
        if: matrix.python-version == '3.14'
        run: pre-commit run --all-files
      - name: Run tests
        run: python -m pytest
