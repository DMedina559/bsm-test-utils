name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go binaries
        run: |
          cd src_go
          
          # Build Linux binary
          GOOS=linux GOARCH=amd64 go build -o ../src/bedrock_server_dummy/data/bedrock_server main.go
          
          # Build Windows binary
          GOOS=windows GOARCH=amd64 go build -o ../src/bedrock_server_dummy/data/bedrock_server.exe main.go

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build python wheel and sdist
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # if: github.event_name == 'release'
