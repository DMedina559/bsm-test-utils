[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm-test-utils"
version = "0.1.0"
description = "Test utilities and dummy bedrock server for testing integration with bedrock server manager"
authors = [
    { name = "Author", email = "author@example.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/example/bsm-test-utils"
Repository = "https://github.com/example/bsm-test-utils.git"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bsm_test_utils"]

[tool.setuptools.package-data]
"bsm_test_utils" = ["data/*"]
